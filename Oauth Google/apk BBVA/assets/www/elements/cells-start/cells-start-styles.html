<html><head></head><body><dom-module id="cells-start-styles"><template><style>:host{display:block;box-sizing:border-box;padding-bottom:100px;font-family:var(--cells-fontDefault, sans-serif);@apply --cells-start;}:host([hidden]), [hidden]{display:none !important;}*, *:before, *:after{box-sizing:inherit;}*:focus{@apply --cells-global-focus;}*:active{@apply --cells-global-active;}button:active{@apply --cells-global-active;}a{color:black;cursor:pointer;}.pagelink{padding:1rem;text-align:center;cursor:pointer;}.pagelink:hover{background-color:var(--bbva-100, #F4F4F4);}.header{font-weight:500;}.mainContainer{display:flex;flex-direction:column;flex-wrap:nowrap;align-items:center;}.productsContainer{width:85%;}.product{padding:1rem;margin:0.5rem 0;cursor:pointer;color:var(--bbva-white, #ffffff);background-color:var(--bbva-core-blue, #1464A5);text-align:center;word-wrap:break-word;}.product:hover{background-color:var(--bbva-white-core-blue, #004481);}.no-product{padding:1rem;background-color:var(--bbva-100, #F4F4F4);width:100%;text-align:center;font-style:italic;}</style></template></dom-module></body></html>
